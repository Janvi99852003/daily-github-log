name: Daily Commit

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "Janvi99852003"
          git config user.email "168864863+Janvi99852003@users.noreply.github.com"

      - name: Commit 1
        run: |
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') - entry 1" >> daily-log.md
          git add daily-log.md
          git commit -m "Daily log update 1: $(date -u '+%Y-%m-%d')"
          git push

      - name: Commit 2
        run: |
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') - entry 2" >> daily-log.md
          git add daily-log.md
          git commit -m "Daily log update 2: $(date -u '+%Y-%m-%d')"
          git push
